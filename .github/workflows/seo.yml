name: Build SEO pages

# Regenerates quote pages, sitemap and robots.txt from data/quotes.json,
# then commits the result so GitHub Pages (branch: main, path: /) picks it up.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-pages
  cancel-in-progress: true

jobs:
  build:
    # Skip the commit this job itself pushes back.
    if: ${{ !contains(github.event.head_commit.message, '[skip-seo]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate pages
        run: node generate.js

      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: regenerate SEO pages [skip-seo]"
          git push
